# python3 PyQtPiClock3.py plugins/currentwind/examples/currentwind.yaml

pages:
  clock-page: {order: 0, layout: classic, theme: circuit}

language: en

location:
  latitude: 45
  longitude: -93
  timezone:

providers:
  openmeteo:
    plugin: PiClock3.OpenMeteo

widgets:
  clock: {plugin: PiClock3.AnalogClock, region: clock}
  date:  {plugin: PiClock3.Date, region: date}

  forecast:
    plugin: PiClock3.Forecast
    region: forecast
    forecast-provider: openmeteo

  current-conditions:
    plugin: plugins.CurrentWind
    region: current
    conditions-provider: openmeteo

logging-level: info
